name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    # This must pass with a pure evaluation (no --impure, no USER env) so that
    # `vars.nix` placeholders are the only thing standing between a fresh
    # template checkout and a working `nix flake check`.
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://niri.cachix.org
            extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964=
      - name: nix flake check
        run: nix flake check --no-build

  eval-toplevel:
    # Evaluates (but does not build) the default NixOS toplevel derivation so
    # module wiring mistakes surface without paying for a full x86_64 build.
    name: eval nixosConfigurations.default toplevel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://niri.cachix.org
            extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964=
      - name: nix eval toplevel drvPath
        run: nix eval --raw .#nixosConfigurations.default.config.system.build.toplevel.drvPath

  fmt:
    name: nixfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nixfmt --check
        run: nix run nixpkgs#nixfmt-rfc-style -- --check $(git ls-files '*.nix')

  shell-lint:
    name: lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: bash -n install.sh
      # shellcheck only understands POSIX/bash, so list the bash scripts
      # explicitly instead of scanning the whole tree (a scan would choke on
      # zsh dotfiles and on fcitx5's INI file named "profile"). zsh files are
      # covered by the `zsh -n` step below. shellcheck is preinstalled on
      # ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck install.sh dotfiles/tmux/pane-border.sh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh syntax check
        run: |
          for f in dotfiles/zsh/*.zsh; do
            zsh -n "$f"
          done
